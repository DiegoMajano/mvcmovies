databases:
  - name: mvcpeliculas-db-rm220481
    databaseName: peliculas_ofs5
    user: peliculas_user
    plan: free

services:
  - type: web
    name: mvcmovies
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free 
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: peliculas_ofs5
          property: connectionString
