version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_peliculas
    environment:
      POSTGRES_DB: "movies-db-rm220481"
      POSTGRES_USER: "admin_des"
      POSTGRES_PASSWORD: "App2026!" 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Peliculas"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvcpeliculas_web
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=dpg-da1lelm417fc73el2rsg-a;Port=5432;Database=peliculas_ofs5;Username=peliculas_user;Password=7qOZ0gW3NC2qzhhSojsEKGPkHlwyNjfv"

volumes:
  postgres_data:
